<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1分の1の人生をつくる</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One&family=Noto+Sans+JP&family=Zen+Kurenaido&family=Zen+Maru+Gothic&family=Zen+Old+Mincho&display=swap">
<style>
:root{--bg:#f2f2f5;--fg:#111;--mu:#666;--card:#fff;--head:#f8f8f9;--bd:#e5e5ea;--ac:#1f3fd1;--acf:#fff;--soft:#eaf0fe;--sum:#f3f3f5;--badge:#111;--badgef:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0f12;--fg:#f1f1f4;--mu:#a0a0aa;--card:#1b1b20;--head:#202026;--bd:#33333b;--ac:#7d96ff;--acf:#0f0f12;--soft:#232a45;--sum:#25252b;--badge:#f1f1f4;--badgef:#111}}
:root[data-theme="dark"]{--bg:#0f0f12;--fg:#f1f1f4;--mu:#a0a0aa;--card:#1b1b20;--head:#202026;--bd:#33333b;--ac:#7d96ff;--acf:#0f0f12;--soft:#232a45;--sum:#25252b;--badge:#f1f1f4;--badgef:#111}
:root[data-theme="umi"]{--bg:#e9f1f7;--fg:#12202c;--mu:#5a6e7d;--card:#fff;--head:#f3f8fb;--bd:#cfdfea;--ac:#1f6fa5;--acf:#fff;--soft:#dcecf7;--sum:#eef4f8;--badge:#12202c;--badgef:#fff}
:root[data-theme="sakura"]{--bg:#fbeff2;--fg:#2e1c21;--mu:#86666e;--card:#fff;--head:#fff7f9;--bd:#f0d5dc;--ac:#c24a73;--acf:#fff;--soft:#fbe3ea;--sum:#fdf3f6;--badge:#2e1c21;--badgef:#fff}
:root[data-theme="mori"]{--bg:#edf3ea;--fg:#1c2a1f;--mu:#62786a;--card:#fff;--head:#f6faf4;--bd:#d3e0cf;--ac:#3f7a53;--acf:#fff;--soft:#dff0e3;--sum:#f3f8f1;--badge:#1c2a1f;--badgef:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.8 var(--ff,"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif)}
#app{max-width:560px;margin:0 auto;padding:16px 14px 56px}
.shell{background:var(--card);border-radius:20px;box-shadow:0 4px 24px rgba(0,0,0,.08);overflow:hidden;border:1px solid var(--bd)}
.hd{display:flex;justify-content:space-between;align-items:center;background:var(--head);border-bottom:1px solid var(--bd);padding:14px 18px}
.hd b{font-size:1.15rem}.hd small{color:var(--mu);font-size:.78rem}
.badge{background:var(--badge);color:var(--badgef);font-size:.85rem;font-weight:700;border-radius:999px;padding:3px 14px;white-space:nowrap}
.bd{padding:22px;min-height:68vh;display:flex;flex-direction:column}.bd.ed{min-height:0}
.push{margin-top:auto;padding-top:20px}
.pill{align-self:flex-start;background:var(--soft);color:var(--ac);font-weight:700;font-size:.8rem;padding:3px 12px;border-radius:999px}
.lab{color:var(--mu);font-weight:700;font-size:.9rem;margin:12px 0 2px}
.et{font-size:1.5rem;line-height:1.4;margin:.1em 0 .5em}
h1{font-size:1.7rem;margin:.2em 0}h2{margin:0}h3{margin:0 0 .4em;font-size:1.05rem}
.mu{color:var(--mu);margin:.4em 0}.sub{color:var(--mu);font-size:.85rem}
.main-c{margin:auto 0;text-align:center;padding:30px 0}.center{text-align:center}.clear{font-size:1.5rem;margin:.3em 0}
.btn{display:block;width:100%;font:inherit;font-weight:700;color:var(--acf);background:var(--ac);border:0;border-radius:12px;padding:14px;margin:8px 0;cursor:pointer}
.btn.dark{background:var(--badge);color:var(--badgef)}a.btn{text-align:center;text-decoration:none}.btn.sub{background:var(--sum);color:var(--fg)}
.opt{display:block;width:100%;font:inherit;font-weight:700;text-align:left;color:var(--fg);background:var(--card);border:1.5px solid var(--bd);border-radius:12px;padding:13px 14px;margin:10px 0;cursor:pointer}
.opt:hover{border-color:var(--ac);background:var(--soft)}
.sumbox{background:var(--sum);border-radius:14px;padding:16px;margin:16px 0}
.sumbox hr{border:0;border-top:1px solid var(--bd);margin:8px 0}.sumbox ul{list-style:none;margin:0;padding:0}.sumbox li{padding:2px 0}.sumbox li:before{content:"・"}
.fade{animation:fd .45s ease}@keyframes fd{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.themes{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:2px;margin-bottom:8px;font-size:.8rem}
button.fn{font:inherit;padding:3px 10px;margin:2px;font-size:.85rem;border-radius:14px;color:var(--fg);background:transparent;border:1px solid var(--bd);cursor:pointer}
button.fn.on{border-color:var(--ac);color:var(--ac)}
button.sw{width:28px;height:28px;border-radius:50%;padding:0;margin:3px;border:2px solid var(--bd);cursor:pointer}
button.sw.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ac)}
.box{border:1px solid var(--bd);border-radius:14px;padding:14px;margin:14px 0}
label{display:block;font-size:.8rem;color:var(--mu);margin:.7em 0 .2em}
label.chk{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:.9rem;margin:.9em 0}label.chk input{width:auto}
input,textarea{width:100%;font:inherit;font-size:.95rem;color:var(--fg);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
textarea{min-height:64px;resize:vertical}input.age{width:100px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.row{grid-template-columns:1fr}}
.ghost{font:inherit;font-size:.85rem;color:var(--mu);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:6px 12px;margin:8px 6px 0 0;cursor:pointer}
.msg{color:#c0392b;font-size:.9rem;min-height:1.4em}
</style></head><body><div id="app"></div>
<script>
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const MAX=15;
const blank=()=>({age:'',t:'',q:'',br:true,a:'',ao:'',b:'',bo:''});
const birth=()=>({age:0,t:'誕生',q:'',br:false,a:'',ao:'',b:'',bo:''});
let life={title:'',events:[birth()],ending:'',theme:'auto',font:'auto'};
let mode='edit',saveOK=true;
try{const d=localStorage.getItem('oo-draft');if(d)life=JSON.parse(d)}catch(e){}
const fix=()=>{
  if(!life.events||!life.events.length||String(life.events[0].age)!=='0')life.events=[birth(),...(life.events||[])].slice(0,MAX);
  life.events.forEach(e=>{if(e.br===undefined)e.br=true;if(e.t===undefined)e.t=''});
  life.events[0].age=0;life.events[0].br=false;if(!life.events[0].t)life.events[0].t='誕生';
  life.title=life.title||'';life.ending=life.ending||'';
};fix();
try{localStorage.setItem('oo-t','1');localStorage.removeItem('oo-t')}catch(e){saveOK=false}
const stText=()=>saveOK?'✓ 入力内容は自動で保存されます（この端末のこのブラウザ）':'⚠ この環境では自動保存できません。「共有URLをつくる」で内容をURLに残してください';
const save=()=>{try{localStorage.setItem('oo-draft',JSON.stringify(life));saveOK=true}catch(e){saveOK=false}const s=document.getElementById('st');if(s)s.textContent=stText()};
const enc=o=>btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o))));
const dec=s=>JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))));
const cmp=(x,y)=>(x.age===''?999:+x.age)-(y.age===''?999:+y.age);
const sorted=l=>({...l,events:[...l.events].sort(cmp)});
const stage=a=>{a=+a;return a>=3&&a<=5?['年少','年中','年長'][a-3]:a>=7&&a<=12?'小'+(a-6):a>=13&&a<=15?'中'+(a-12):a>=16&&a<=18?'高'+(a-15):a>=19&&a<=22?'大'+(a-18):''};
const ageL=a=>a+'歳'+(stage(a)?' ('+stage(a)+')':'');

const THEMES=[['auto','自動','linear-gradient(90deg,#f2f2f5 50%,#0f0f12 50%)'],['light','ライト','#f2f2f5'],['dark','ダーク','#0f0f12'],['umi','海','#1f6fa5'],['sakura','桜','#c24a73'],['mori','森','#3f7a53']];
const FONTS=[['auto','丸ゴシック',''],['gothic','ゴシック','"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif'],['mincho','明朝','"Hiragino Mincho ProN","Yu Mincho",Georgia,serif'],['zenmin','Zen旧明朝','"Zen Old Mincho","Hiragino Mincho ProN",serif'],['klee','クレー','"Klee One","Yu Kyokasho",serif'],['kure','紅道（手書き）','"Zen Kurenaido","Klee One",cursive']];
let theme=life.theme||'auto',font=life.font||'auto';
const setTheme=t=>{document.documentElement.dataset.theme=['light','dark','sakura'].includes(t)?t:'light'};
const setFont=f=>{document.documentElement.style.removeProperty('--ff')};
setTheme(theme);setFont(font);
const bar=()=>`<div class="themes"><span class="sub">色合い</span>${THEMES.filter(t=>['light','dark','sakura'].includes(t[0])).map(t=>`<button class="sw${(['light','dark','sakura'].includes(theme)?theme:'light')===t[0]?' on':''}" data-th="${t[0]}" title="${t[1]}" aria-label="${t[1]}" style="background:${t[2]}"></button>`).join('')}</div>`;
const shell=(badge,inner,cls)=>bar()+`<div class="shell fade"><div class="hd"><span><b>1分の1ゲーム</b><small> - 1 over 1 game -</small></span><span class="badge">${badge}</span></div><div class="bd ${cls||''}">${inner}</div></div>`;

function editor(msg,url){
  mode='edit';theme=life.theme||'auto';setTheme(theme);font=life.font||'auto';setFont(font);
  const ev=life.events.map((e,i)=>`<div class="box"><h3>${i===0?'誕生（0歳）':'出来事 '+i}</h3>
  ${i?`<label>何歳のとき？</label><input class="age" type="number" min="1" max="120" inputmode="numeric" data-i="${i}" data-k="age" value="${esc(e.age)}">`:''}
  <label>タイトル（短く）</label><input data-i="${i}" data-k="t" value="${esc(e.t)}" placeholder="${i?'例：発表会の役決め':'誕生'}">
  <label>${i?'何が起きた？どんな場面？':'誕生時の様子（どんな家で、どんなふうに生まれた？）'}</label><textarea data-i="${i}" data-k="q">${esc(e.q)}</textarea>
  ${i?`<label class="chk"><input type="checkbox" data-i="${i}" data-k="br"${e.br?' checked':''}> この出来事に分岐（選択肢）をつける</label>`:''}
  ${e.br?`<div class="row"><div><label>選択肢A</label><input data-i="${i}" data-k="a" value="${esc(e.a)}">
  <label>Aを選ぶとどうなった？</label><textarea data-i="${i}" data-k="ao">${esc(e.ao)}</textarea></div>
  <div><label>選択肢B</label><input data-i="${i}" data-k="b" value="${esc(e.b)}">
  <label>Bを選ぶとどうなった？</label><textarea data-i="${i}" data-k="bo">${esc(e.bo)}</textarea></div></div>`:''}
  ${i?`<button class="ghost" data-del="${i}">この出来事を削除</button>`:''}</div>`).join('');
  app.innerHTML=shell('つくる',`<h2>1分の1の人生をつくる</h2>
  <p class="mu">誕生（0歳）から始まる出来事を、最大${MAX}個まで。分岐のある出来事には二つの選択肢をつけられます。どちらを選んでも、人生はひとつの道へ続きます。</p>
  <p class="sub" id="st">${stText()}</p>
  <div class="box"><label>この人生のタイトル</label><input data-k="title" value="${esc(life.title)}" placeholder="例：ある花屋の一生"></div>
  ${ev}
  ${life.events.length<MAX?`<button class="ghost" id="add">＋ 出来事を追加（${life.events.length}/${MAX}）</button>`:`<p class="sub">出来事は最大${MAX}個です。</p>`}
  <button class="ghost" id="sort">年齢順に並べ替える</button>
  <p class="sub">※年齢を入力している間は並べ替えません。「遊ぶ」「共有」のときは自動で年齢順になります。</p>
  <div class="box"><label>この人生の結末</label><textarea data-k="ending" placeholder="どう選んでも、最後にたどり着いた場所">${esc(life.ending)}</textarea></div>
  <div class="msg">${esc(msg||'')}</div>
  <button class="btn" id="play">試しに遊ぶ</button><button class="btn sub" id="share">共有URLをつくる</button>
  ${url?`<div class="box"><label>共有URL（コピーして保管・送信できます）</label><input readonly id="url" value="${esc(url)}"></div>`:''}
  <details><summary class="sub">共有URLから内容を読み込む</summary><input id="ld" placeholder="共有URLを貼りつけ"><button class="ghost" id="load">読み込む</button></details>`,'ed');
}
function valid(){
  if(!life.title.trim())return'タイトルを入力してください';
  for(let i=0;i<life.events.length;i++){const e=life.events[i];
    if(e.age===''||!e.q.trim()||(e.br&&(!e.a.trim()||!e.b.trim()||!e.ao.trim()||!e.bo.trim())))return`${i?'出来事'+i:'誕生'}の入力が足りません`;
    if(i>0&&(+e.age<1||+e.age>120))return`出来事${i}は1〜120歳にしてください（0歳は誕生です）`}
  if(!life.ending.trim())return'結末を入力してください';
  return'';
}
app.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;
  const v=t.type==='checkbox'?t.checked:t.value;if(t.dataset.i!==undefined)life.events[+t.dataset.i][k]=v;else life[k]=v;save()});
app.addEventListener('change',e=>{const t=e.target;if(t.dataset.k==='br'){save();editor()}});
app.addEventListener('click',e=>{const t=e.target;
  if(t.dataset.fn){font=t.dataset.fn;setFont(font);if(mode==='edit'){life.font=font;save()}
    app.querySelectorAll('.fn').forEach(b=>b.classList.toggle('on',b.dataset.fn===font))}
  else if(t.dataset.th){theme=t.dataset.th;setTheme(theme);if(mode==='edit'){life.theme=theme;save()}
    app.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.th===theme))}
  else if(t.id==='add'){life.events.sort(cmp);life.events.push(blank());save();editor()}
  else if(t.id==='sort'){life.events.sort(cmp);save();editor()}
  else if(t.dataset.del!==undefined){life.events.splice(+t.dataset.del,1);save();editor()}
  else if(t.id==='play'){const m=valid();m?editor(m):play(sorted(life),true)}
  else if(t.id==='share'){const m=valid();if(m)return editor(m);life.events.sort(cmp);save();
    editor('',location.href.split('#')[0]+'#'+enc(life));
    const u=document.getElementById('url');u.select();try{navigator.clipboard.writeText(u.value)}catch(x){}}
  else if(t.id==='load'){try{const v=document.getElementById('ld').value.trim();life=dec(v.includes('#')?v.split('#').pop():v);fix();save();editor('読み込みました')}catch(x){editor('読み込めませんでした')}}
});

function play(l,fromEditor){
  l.events.forEach(e=>{if(e.br===undefined)e.br=true});
  let i=0,log=[];mode='play';theme=l.theme||'auto';setTheme(theme);font=l.font||'auto';setFont(font);
  const last=l.events[l.events.length-1].age;
  const head=e=>`<div class="pill">発生確率: 1 / 1 (100%)</div><div class="lab">対象年齢: ${ageL(e.age)}</div>`;
  const next=()=>{i++;i<l.events.length?scene():end()};
  const title=()=>{i=0;log=[];
    app.innerHTML=shell('START',`<div class="main-c"><h1>${esc(l.title)}</h1><p class="mu">確率1/1。<br>ある人の、たったひとつの人生の歯車を、あなたはのぞき見る。<br>何を選んでも、100%ひとつの道に収束する。</p></div>
    <div class="push"><button class="btn" id="go">人生を覗き見る</button>${fromEditor?'<button class="btn sub" id="back">編集に戻る</button>':''}</div>`);
    document.getElementById('go').onclick=scene;const b=document.getElementById('back');if(b)b.onclick=()=>editor()};
  const scene=()=>{const e=l.events[i];
    app.innerHTML=shell(ageL(e.age),`${head(e)}${e.t?`<h2 class="et">${esc(e.t)}</h2>`:''}<p class="mu">${nl(e.q)}</p>
    <div class="push">${e.br?`<button class="opt" data-c="a">${esc(e.a)}</button><button class="opt" data-c="b">${esc(e.b)}</button>`:'<button class="btn" id="nx0">次へ進む</button>'}</div>`);
    if(e.br)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>outcome(b.dataset.c));
    else document.getElementById('nx0').onclick=()=>{log.push({age:e.age,t:e.t||e.q.slice(0,20)});next()}};
  const outcome=c=>{const e=l.events[i];const first=!log.some(x=>x.choice);log.push({age:e.age,t:e.t,choice:e[c]});
    app.innerHTML=shell(ageL(e.age),`${head(e)}<h2 class="et">結果: ${esc(e.t||e[c])}</h2>
    <p class="mu"><b>【あなたの選択】</b>${esc(e[c])}<br><br>${first?'<b>【運命の収束】</b>もう一方を選んでいても、この人生は同じ道へ続いていた。<br><br>':''}<b>【結果】</b>${nl(e[c+'o'])}</p>
    <div class="push"><button class="btn" id="nx">運命を受け入れて次へ</button></div>`);
    document.getElementById('nx').onclick=next};
  const end=()=>{const n=log.filter(x=>x.choice).length;
    const base=location.href.split('#')[0],full=base+'#'+enc(l),su=full.length<1800?full:base;
    const xurl='https://twitter.com/intent/tweet?text='+encodeURIComponent('自分の人生をゲームにしました。『'+l.title+'』（0〜'+last+'歳・出来事'+l.events.length+'個）\n選んだ道は違っても、たどり着く先はひとつ。のぞいてみてね。')+'&url='+encodeURIComponent(su);
    app.innerHTML=shell('完',`<div class="center"><h2 class="clear">『${esc(l.title)}』クリア</h2>
    <p class="mu">あなたは、確率1/1で決まっていたひとりの人生を、${esc(last)}歳まで見届けました。歯車は、少しも狂いませんでした。</p></div>
    ${l.ending?`<p>${nl(l.ending)}</p>`:''}
    <div class="sumbox"><b>【到達ステータスサマリー】</b><p class="mu sub">到達した結末：1 / 1（100%）　辿った分岐点：${n}個</p><hr>
    <ul>${log.map(x=>`<li>${esc(x.age)}歳：${x.choice?esc(x.t?x.t+' ➜ ':'')+esc(x.choice):esc(x.t)}</li>`).join('')}</ul></div>
    <div class="push"><a class="btn dark" id="xs" target="_blank" rel="noopener" href="${esc(xurl)}">この人生をXでシェアする</a><button class="btn sub" id="again">もう一度覗き見る</button><button class="btn sub" id="home">タイトルに戻る</button><button class="btn sub" id="mk">${fromEditor?'編集に戻る':'自分の人生をつくる'}</button></div>`);
    document.getElementById('again').onclick=()=>{i=0;log=[];scene()};
    document.getElementById('home').onclick=title;
    document.getElementById('mk').onclick=()=>{history.replaceState(null,'',location.pathname);editor()}};
  title();
}

(function(){
  if(location.hash.length>1){try{return play(dec(location.hash.slice(1)),false)}catch(e){}}
  editor();
})();
</script></body></html>
